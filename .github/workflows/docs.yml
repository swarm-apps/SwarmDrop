name: Deploy Docs

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      # Web 应用区吃的是**入库**的 wasm 产物（CI 不再重建，见下方 build 步骤的注释），
      # 所以触发判据是产物本身变没变，不是 crates/ 源码变没变。
      # 三个本地包 docs 都以 file:/link: 引着（file-browser / shared-view / swarmdrop-web）。
      - "packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个 Pages 部署，且不取消进行中的（避免半成品上线）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      # 从根 package.json 的 packageManager 字段读唯一版本，避免冲突
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      # docs 通过自身的 docs/pnpm-workspace.yaml 建立独立 workspace 边界，
      # 避免被仓库根 workspace 劫持安装；native 依赖的 build 脚本也在该文件里 allowBuilds。
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # ⚠️ **这里刻意没有「重新生成 WASM」这一步。** 用的是仓库入库的
      # `packages/swarmdrop-web/`（docs 以 `link:` 引着，pnpm install 后直接吃到）。
      #
      # 2026-08-13 从「每次在 CI 重新生成」改成现在这样，起因是一条只在 Pages 上出现、
      # 本地怎么都复现不了的故障：Web 端一加载就报
      # `RangeError: WebAssembly.Table.grow(): failed to grow table by 4`，节点起不来。
      #
      # 根因是 wasm-opt 的版本。上一版为了摆脱 wasm-pack 裸下载 binaryen（无重试无缓存，
      # 2026-08-12 就这么挂过一次：`failed to download binaryen-version_117`，编译跑完
      # 1m37s 才在最后一步红掉）改成了 `apt install binaryen` —— 而 **Ubuntu noble 的
      # binaryen 是 108-1**，2022 年的版本。它优化时重排了 table 却没重映射导出索引，
      # 产出的 `__wbindgen_externrefs` 指向 **funcref 表**（`min == max == 3612`，
      # 物理上不可 grow），而不是本该指向的 externref 表（无 `max`）。于是 JS glue 里
      # 那句 `table.grow(4)` 必然抛 RangeError。本地 wasm-pack 自己拉的是新版 binaryen，
      # 产物一直是对的 —— 这就是本地复现不了的原因。
      #
      # 改用入库产物后，binaryen 的**版本**与**下载稳定性**两条依赖一起消失，顺带省掉
      # 几分钟 wasm 编译。代价是产物可能过期，由 `scripts/check-wasm-artifact.sh`
      # 在 PR 阶段兜底（rust.yml 的 wasm job）。
      #
      # 改了 wasm 侧的 crate 就要本地跑 `pnpm build:wasm`（在 docs/ 下）并提交产物 ——
      # 就是历史上那些 `chore(web): 重建 wasm 产物` 提交。
      - name: Build docs (static export)
        env:
          # 自定义域名部署在域名根，**没有 basePath**。这里只注入 origin，
          # 供 metadataBase / sitemap 产出绝对 URL（缺它会让 docs/lib/site.ts 直接报错）。
          #
          # ⚠️ 域名的权威源是仓库 Settings → Pages 的 Custom domain 字段。本仓是
          # workflow 型部署，仓库里的 CNAME 文件会被 GitHub **忽略** —— 别再放一个。
          # 完整配置顺序见 docs/README.md 的「自定义域名怎么配」。
          # 自定义域名（swarmapp.cn）待备案，暂留 Pages 子路径部署。
          # 三处要一起改：这两个 env、next.config.mjs 的 basePath 注释、
          # crates/invite 的 INVITE_URL_PREFIX。
          PAGES_SITE_ORIGIN: https://swarm-apps.github.io
          PAGES_BASE_PATH: /SwarmDrop
        run: pnpm build

      # 阻止 GitHub Pages 的 Jekyll 吞掉 _next/ 目录
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

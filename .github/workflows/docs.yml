name: Deploy Docs

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      # try 页面依赖 crates/web 生成的 WASM；网络内核和依赖锁变更同样会改变产物。
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个 Pages 部署，且不取消进行中的（避免半成品上线）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      # 从根 package.json 的 packageManager 字段读唯一版本，避免冲突
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      # docs 通过自身的 docs/pnpm-workspace.yaml 建立独立 workspace 边界，
      # 避免被仓库根 workspace 劫持安装；native 依赖的 build 脚本也在该文件里 allowBuilds。
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Pages 必须在当前提交重新生成 WASM，不能复用仓库中可能已经过期的产物包。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      # wasm-pack 在 release 构建里会跑 wasm-opt，而它找 wasm-opt 的顺序是
      # **先 `which`、找不到才去 GitHub release 下载 binaryen tarball**。那次下载没有
      # 重试也没有缓存，2026-08-12 就这么挂过一次（v0.21.0 的文档站部署，报
      # `failed to download binaryen-version_117`）—— 编译已经跑完 1m37s 才在最后一步
      # 因为一个与本仓无关的下载失败整条红掉，而线上 Web 端因此停在了上一个 wire 版本。
      #
      # 从 apt 装进 PATH 之后 wasm-pack 直接命中第一条分支，那条网络依赖整个消失。
      - name: Install binaryen (provides wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build WebAssembly
        run: pnpm build:wasm

      - name: Build docs (static export)
        env:
          # 自定义域名部署在域名根，**没有 basePath**。这里只注入 origin，
          # 供 metadataBase / sitemap 产出绝对 URL（缺它会让 docs/lib/site.ts 直接报错）。
          #
          # ⚠️ 域名的权威源是仓库 Settings → Pages 的 Custom domain 字段。本仓是
          # workflow 型部署，仓库里的 CNAME 文件会被 GitHub **忽略** —— 别再放一个。
          # 完整配置顺序见 docs/README.md 的「自定义域名怎么配」。
          # 自定义域名（swarmapp.cn）待备案，暂留 Pages 子路径部署。
          # 三处要一起改：这两个 env、next.config.mjs 的 basePath 注释、
          # crates/invite 的 INVITE_URL_PREFIX。
          PAGES_SITE_ORIGIN: https://swarm-apps.github.io
          PAGES_BASE_PATH: /SwarmDrop
        run: pnpm build

      # 阻止 GitHub Pages 的 Jekyll 吞掉 _next/ 目录
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

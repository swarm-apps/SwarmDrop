name: CLI release polish

# 把 dist 创建的 CLI release 在**共享的** releases 列表里摆正。做两件事：
#
# 1. **标题带上产品线**。三条版本线发到同一个 releases 列表里，另外两条自带前缀
#    （`SwarmDrop v0.23.0` / `SwarmDrop Mobile mobile-v0.23.0`），CLI 却是裸的
#    `0.1.0 - 2026-08-19` —— 那是 dist 从 `crates/cli/CHANGELOG.md` 的 section 标题
#    原样取的。**改不了**：`announcement_title` 没有对应配置项（`display-name` 只管
#    installer 文案），而给 changelog 标题加前缀会让 parse_changelog 认不出版本号，
#    连正文一起丢（三种写法实测都退化成「标题 = tag」且 notes 为空）。所以只能事后改。
#
# 2. **把 "Latest" 还给桌面端**。GitHub 把最新创建的非 prerelease release 标为 latest，
#    于是 CLI 一发版就把它从桌面端手里拿走 —— 而仓库首页的 Releases 侧栏和
#    `releases/latest` 都跟着它走，访客会落到一个命令行工具的页面上。CLI 有自己的分发
#    渠道（brew / npm / installer 脚本），不需要占这个位。
#
#    ⚠️ **必须显式把 latest 交给桌面 release，不能只给自己设 `make_latest=false`**：
#    那个值的语义是「别把**这个** release 设为 latest」，不是「取消现有的 latest」。
#    latest 在 GitHub 这里总要指向某个 release —— 实测对 CLI 发 `make_latest=false`
#    （gh CLI 与 REST API 两条路都试过）之后，它仍然是 latest，因为它依然是最新创建的
#    非 prerelease release。
#
# ## 为什么是 dist 的 post-announce job，而不是 `on: release: published`
#
# 前两版都写成 `on: release: [published]`，**两次都一条运行记录都没有**
# （`cli/swarmdrop-cli-v0.2.0` 与 `v0.3.0` 的标题和 latest 都是事后手工补的）。
# 根因有**两条独立的**，第一次只查出了第二条、以为修好了：
#
# 1. **GITHUB_TOKEN 造出来的事件不触发新的 workflow run。** 这是 GitHub 防递归的硬规则
#    （例外只有 `workflow_dispatch` / `repository_dispatch`）。而 release 正是
#    `cli-release.yml` 的 `host` job 用 `GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}` 跑
#    `gh release create` 造出来的 —— 于是 `release: published` 这个事件根本不会派生
#    运行。**换个分支、换个触发类型都绕不开，除非改用 PAT。**
# 2. `release` 事件只从默认分支读 workflow 定义（这类事件不附带 commit，GitHub 无从
#    知道该拿哪一版）。这条也真、也踩过，但它只是必要条件。
#
# 所以改成 dist 的 **post-announce job**：由 `cli-release.yml` 在 `announce` 之后
# `uses:` 调进来，跑在**同一次运行**里。没有事件、就没有 token 限制；也不再依赖
# 「文件躺在 main 上」—— workflow_call 跟着 tag 所在的 commit 走。
# 接线在 `dist-workspace.toml` 的 `post-announce-jobs`，**改完要 `dist generate`**
# 重新产出 `cli-release.yml`（那个文件是生成物，手改会被覆盖）。
#
# 代价：手动在 UI 上 publish 一个 release 不再会被摆正。可以接受 —— CLI 的 release
# 一律由 dist 创建。

on:
  workflow_call:
    inputs:
      # dist 传给每个自定义 job 的发布计划（dist-manifest 的 JSON）。
      plan:
        required: true
        type: string

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      # 取自 plan 而不是 `github.ref_name`：dist 自己就是按这两个字段建的 release，
      # 跟着它走就不会有第二套解析。
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      IS_PRERELEASE: ${{ fromJson(inputs.plan).announcement_is_prerelease }}
    steps:
      - name: Retitle and hand latest back
        run: |
          set -euo pipefail

          # cli/swarmdrop-cli-v0.1.1 → 0.1.1；旧形式 cli/v0.1.0 → 0.1.0 也吃得下。
          # 版本里的 -rc.1 等后缀保留（rc 不含 v，不会被截断）。
          version="${TAG##*/}"
          version="${version##*v}"

          # 标题完全由 tag 推出，所以重跑一次结果相同 —— 不需要幂等守卫。
          gh release edit "$TAG" --repo "$REPO" --title "SwarmDrop CLI v${version}"
          echo "✓ $TAG → SwarmDrop CLI v${version}"

          # prerelease 本来就不会成为 latest，不必打扰桌面那条线。
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "prerelease — 不动 latest"
            exit 0
          fi

          # 把 latest 还给最新的桌面 release（tag `v<数字>`，排除 mobile-v* 与 cli/*）。
          # releases API 按创建时间倒序返回，所以最新的桌面版一定在第一页。
          # ⚠️ 不要加 `--paginate`：那会让 jq 对**每一页**各求一次值，`first` 于是每页出
          # 一个，$desktop 变成多行 id，后面的 PATCH URL 直接废掉。
          desktop=$(gh api "repos/$REPO/releases?per_page=100" \
            -q '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]")))] | first | .id' \
            | head -1)

          if [ -n "$desktop" ] && [ "$desktop" != "null" ]; then
            gh api -X PATCH "repos/$REPO/releases/$desktop" -f make_latest=true >/dev/null
            echo "✓ latest 已交还给 $(gh api "repos/$REPO/releases/$desktop" -q .tag_name)"
          else
            echo "⚠ 没找到桌面 release，latest 保持不动"
          fi

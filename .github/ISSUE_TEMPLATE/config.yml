# Blank issues stay enabled on purpose — this is a small project, and a rough report is
# better than a would-be reporter bouncing off a required form.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability
    url: https://github.com/swarm-apps/SwarmDrop/security/advisories/new
    about: Report privately instead of opening a public issue. Scope and threat model are in SECURITY.md.

  - name: Documentation
    url: https://swarm-apps.github.io/SwarmDrop/docs
    about: Concepts, security model, self-hosting a bootstrap node, and the MCP guide.

  - name: Contributing guide
    url: https://github.com/swarm-apps/SwarmDrop/blob/main/CONTRIBUTING.md
    about: Setup, the pre-commit checks, and conventions that aren't obvious from the code.

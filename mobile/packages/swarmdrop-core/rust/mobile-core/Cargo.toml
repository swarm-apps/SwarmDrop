[package]
name = "swarmdrop-mobile-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "swarmdrop_mobile_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# 与桌面共享的业务核心。单仓后是普通 workspace path 依赖，改 crates/core 立刻对
# 移动端生效，`cargo check --workspace` 也会一并覆盖本 crate。
swarmdrop-core = { workspace = true }
# 端口的 native 实现。移动端只用得上其中的设备配置那份——文件落点走系统文档提供方，
# FileAccess 自有实现（SAF / iOS 的落点语义与本地路径不同）。
swarmdrop-host-fs = { workspace = true }
swarmdrop-storage-sql = { workspace = true }
swarmdrop-invite = { workspace = true }
entity = { workspace = true }
migration = { workspace = true }
swarmdrop-net = { workspace = true }

async-trait = { workspace = true }
# 只用来给 staging 文件算确定性名字（见 file_staging.rs）。选它而不是 std 的
# DefaultHasher：后者的输出不保证跨版本稳定，而这个名字必须在进程重启后仍能重算出来。
# 版本跟随其余四个 crate 的写法（本仓 blake3 不走 workspace.dependencies）。
blake3 = "1.8.3"
# `file://` URI 与文件系统路径之间的百分号编解码（见 utils.rs）。expo 给出的 URI 是
# 编码过的，而 Rust 侧的 Path 要的是解码后的字节——两侧不对齐会让含空格 / 中文的
# 文件名在「打开 / 分享 / 删除」上全线失效。已在依赖树里（libp2p 用它），不增编译成本。
percent-encoding = "2.3"
sea-orm = { workspace = true, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sea-orm-migration = { workspace = true }
# 只用得到 serde_json（已配对设备清单的 JSON 编解码）；本 crate 自己没有类型再 derive
# Serialize —— 设备名那份落盘结构随 `JsonFileDeviceConfig` 一起搬进 crates/host-fs 了。
serde_json = { workspace = true }
thiserror = { workspace = true }
# "fs" 供发布路径用（建目录 / canonicalize / rename / copy）。这些都会阻塞，而
# mobile-core 的 async 全挤在 async-compat 那根单线程 runtime 上（见
# dev-notes/knowledge/rust-backend.md），必须走 tokio::fs 的 spawn_blocking 而不是 std::fs。
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "fs"] }
tracing = { workspace = true }
# 日志订阅端。此前本 crate 只有 `tracing` 门面而没有任何 subscriber，
# 导致 crates/* 的 tracing 宏在移动端全是空操作 —— 日志不是难取得，是从未产生。
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }

uniffi = { version = "0.31.0", features = ["bindgen", "build", "cli", "tokio"] }

# iOS 的平台原生日志层，输出到 os_log（Console.app / Xcode 可见）。
#
# Android 侧**刻意不加依赖**：现成的 tracing-logcat（停更 2 年）与 tracing-android
# （停更 4 年）都不再维护，而这层的全部工作只是把字节交给 NDK 的
# `__android_log_write`，自己声明 extern "C" 即可（liblog 在 Android 上默认链接）。
# 实现见 `src/logging/android.rs`，决策见 openspec 的 mobile-logging design D2。
[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

# release profile 见 workspace root 的 `[profile.mobile-release]` —— 写在这里会被
# Cargo 忽略（非 root package 的 profile 不生效）。

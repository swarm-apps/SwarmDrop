packages:
  - "packages/swarmdrop-core"

# React Native 的 Metro bundler 不认 pnpm 默认的 symlink(isolated) node_modules，
# 必须扁平安装。这一项原先在 mobile/.npmrc 里写作 `node-linker=hoisted`——pnpm 10
# 读它，**pnpm 11 不读**，会静默退回 isolated：顶层包数从 847 掉到 70，
# `expo-modules-core` 等传递依赖不再出现在顶层，typecheck 与 Metro 双双找不到模块。
nodeLinker: hoisted

# 以下三项原先在 mobile/package.json 的 `pnpm` 字段里——RN 独立仓时用 pnpm 10，那个
# 版本还读该字段。并入单仓后统一走根 package.json 的 packageManager (pnpm@11.10.0)，
# 而 **pnpm 11 不再读 package.json 的 `pnpm` 字段**，配置必须搬到这里，否则被静默忽略：
#
#   - overrides 失效 → frozen-lockfile 报 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH（会 fail，
#     属于响的错误）
#   - patchedDependencies 失效 → ubrn 的本地 patch 不打，**不报错**，直接拿未打补丁的
#     版本去生成绑定（属于哑的错误，危险得多）
# 等价于 pnpm 10 时代的 `onlyBuiltDependencies: ["esbuild"]`——那是个白名单，语义是
# 「只有 esbuild 能跑 build script，其余一律不跑」，且不吭声。pnpm 11 改成：未表态的
# 依赖会直接 ERR_PNPM_IGNORED_BUILDS 报错，要求逐个声明。故这里把当时被隐式忽略的四个
# 显式写成 false，行为与迁移前完全一致。
#
# 这四个都是 e2e 的 WebDriver 依赖，build script 干的是下载 driver 二进制；appium 的
# driver 由 `pnpm e2e:ios:driver` 单独管理，不靠 install 期的 build script。
allowBuilds:
  esbuild: true
  appium: false
  appium-ios-tuntap: false
  edgedriver: false
  geckodriver: false

overrides:
  lightningcss: 1.30.1

# expo-file-system 56.0.8 的 SAF FileHandle 只保留了 FileChannel，未持有创建它的
# ParcelFileDescriptor；PFD 被 GC 回收后会连带关闭底层 fd，表现为大文件写入到随机位置
# 后报 Bad file descriptor。PFD 生命周期修复来自上游 expo/expo#47176；补丁另外给
# read/write 的失败带上异常类名（上游只取 e.message，最要紧的几种恰好为 null），
# 并给 offset setter 补 ensureIsOpen()。升级时需逐项核对后删除。
#
# ⚠️ 这里此前写着「补丁还允许以 "rw" 打开 SAF 的可定位写通道」——**与 patch 实际内容相反**
# （2026-08-10 更正）。patch 明确保留了上游对 SAF "rw" 的拒绝：FileOutputStream.getChannel()
# 是 readable=false 的 channel，冒充 "rw" 只会得到一个「签名说能读、实际不能读」的句柄。
# 接收侧也不需要它——staging 恒在应用私有目录，SAF 只在 publish 时被顺序写一次。
#
# ⚠️ **光在这里声明补丁不等于它进了构建。** Android 侧默认吃 expo 发布的预编译 AAR，
# 这份 Kotlin patch 在 2026-08-10 之前从未参与编译（pnpm install 全绿、node_modules 里的
# 源码也确实是打过补丁的，唯独产物不是）。靠 mobile/package.json 的
# expo.autolinking.android.buildFromSource 打开源码编译，靠 mobile/scripts/check-expo-patches.mjs
# 的 javap 符号断言看守。原委见 dev-notes/knowledge/toolchain.md
# 「pnpm patch 打在有预编译产物的原生依赖上会静默失效」。
patchedDependencies:
  expo-file-system@56.0.8: patches/expo-file-system@56.0.8.patch

minimumReleaseAgeExclude:
  - '@swarm-hive/sdk@0.5.0'

# ubrn 的 dunce patch 已随 0.31.0-3（PR #367）合入上游，patch 删除。
# 仍需的 Node-24 exports 兼容修复见 .pnpmfile.cjs（readPackage 给 ubrn 补 ./package.json 导出）。

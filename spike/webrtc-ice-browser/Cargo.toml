[package]
name = "webrtc-ice-browser-spike"
version = "0.1.0"
edition = "2024"
publish = false

# 独立 workspace：spike 是临时探针，不进根 workspace（否则拖慢主构建、
# 且 webrtc 0.20-rc 会和 libp2p-webrtc 依赖的 0.17 在锁文件里打架）。
[workspace]

[dependencies]
webrtc = "0.20.0-rc.4"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"

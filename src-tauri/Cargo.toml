[package]
name = "swarmdrop"
version = "0.24.0"
description = "A Tauri App"
authors = ["you"]
edition.workspace = true
repository = "https://github.com/swarm-apps/SwarmDrop"
homepage = "https://github.com/swarm-apps/SwarmDrop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swarmdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# **bin 名不能是 `swarmdrop`**：`crates/cli` 的 bin 也叫这个，两者都写
# `target/<profile>/swarmdrop`，后构建的那个**静默覆盖**前一个。cargo 只给一条
# `output filename collision` 警告（并写明「this may become a hard error in the future」，
# rust-lang/cargo#6313），构建照样成功。
#
# 后果不在构建而在测试：`crates/cli/tests/` 经 `env!("CARGO_BIN_EXE_swarmdrop")` 跑二进制，
# 拿到的可能是桌面壳——它在无窗口环境下启动即退出，于是那几条测试以「退出码 0、stdout 空」
# 失败，报出来的却是 `["pair"] 仍然可用` 这类**完全指错方向**的断言消息。
# 谁赢取决于构建顺序，所以它是随机红的，`cargo test -p swarmdrop-cli` 单跑还必过。
#
# 反过来改 CLI 那个不行：用户敲的就是 `swarmdrop`，且已发到 npm 与 homebrew。
#
# **对外产物名不受影响**：`swarmdrop.app` / `swarmdrop_x.y.z_aarch64.dmg` /
# `swarmdrop.app.tar.gz` 都由 `productName` 决定，与 bin 名无关。变的是 `.app` 内部的
# `Contents/MacOS/swarmdrop-desktop`（`CFBundleExecutable` 由 Tauri 一并写对）与
# Windows 的 `swarmdrop-desktop.exe`。
#
# ⚠️ **不要用 `tauri.conf.json` 的 `mainBinaryName` 把内部名改回 `swarmdrop`。**
# 那个字段是在 `tauri build` 阶段**重命名 cargo 产物**（`--no-bundle` 也一样），
# 也就是把 `target/<profile>/swarmdrop-desktop` move 成 `swarmdrop`——冲突原样回归，
# 而且更糟：产物叫什么变成取决于最后跑的是 `cargo build` 还是 `tauri build`，
# `e2e/desktop/wdio.conf.ts` 那种写死路径的地方于是没有正确答案。2026-08-19 实测过。
[[bin]]
name = "swarmdrop-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# **不由 dist 管**。dist-workspace.toml 的 members 只列 CLI，但 dist 仍会扫描 workspace 里
# 每个有 bin 的包；补了 repository 之后它就把这个包也当成可发布对象了（`dist plan` 会
# 多 announce 一个版本）。这里显式排除——桌面端走 Tauri + SwarmHive 那条流水线。
[package.metadata.dist]
dist = false

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
tokio = "1.49.0"
async-trait = { workspace = true }
swarmdrop-net = { workspace = true }
swarmdrop-core = { workspace = true, features = ["specta"] }
# 端口的 native 实现。core 只给端口，实现由宿主自己选——谁用实现谁声明它。
swarmdrop-host-fs = { workspace = true }
swarmdrop-storage-sql = { workspace = true, features = ["specta"] }
swarmdrop-invite = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
# 文件层：按天轮转 + 保留数上限。与移动端同一套写法（见 mobile-core 的 logging 模块），
# 参数保持一致以免两端日志行为分叉。
# ⚠️ `non_blocking()` 返回的 guard 一旦 drop，后台写线程就停、日志静默消失且不报错，
# 它必须存进 Tauri managed state。
tracing-appender = { workspace = true }
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
# MCP Bridge —— 仅 debug 注册(见 setup.rs::register_plugins),供 AI 调试桥使用;
# release 会编译但不注册,因此攻击面仅限 dev。无条件依赖以便 tauri-build 收集其 ACL。
tauri-plugin-mcp-bridge = "0.12"
# WebdriverIO 原生模式 E2E(e2e/desktop)—— 同上,仅 debug 注册,无条件依赖以便 tauri-build 收集 ACL。
# tauri-plugin-wdio-webdriver 起内嵌 WebDriver server(零外部进程);tauri-plugin-wdio 提供
# browser.tauri.execute / IPC mock / 日志采集,配合前端 @wdio/tauri-plugin 使用。
tauri-plugin-wdio-webdriver = "1"
tauri-plugin-wdio = "1"
rand = "0.10.0"
chrono = "0.4.43"
dashmap = "6.1.0"
tauri-plugin-dialog = "2"
walkdir = "2"
tauri-plugin-http = "2.5.7"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
path-slash = "0.2.1"
pathdiff = "0.2.3"
tokio-util = "0.7"
sea-orm = { workspace = true, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sea-orm-migration = { workspace = true }
entity = { workspace = true }
migration = { workspace = true }
rmcp = { version = "2", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
url = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid", "chrono", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript", "derive"] }
# 桌面壳原生字符串（托盘菜单 + 系统通知）本地化。前端 Lingui 管 App 内文案，rust-i18n
# 只覆盖 Rust 直接渲染的 OS 表面。locale 目录见 src-tauri/locales/，i18n! 宏在 lib.rs，
# 缺项回退源 locale zh。
# 身份文件的原子写（`host/identity_store.rs`）。**不是新增编译单元**——
# tauri-plugin-updater 已经把它拉进依赖树了，这里只是把它变成显式依赖。
# 用它而不是手搓：随机名 + O_EXCL + unix 0600 + 「任何提前返回都在 drop 时清残留」
# 这四条正是它的实现保证，自己写就是把安全攸关的 POSIX 管道再证明一遍。
tempfile = "3"
rust-i18n = "4"
tauri-plugin-deep-link = "2.4.9"

# Windows：运行时自注册「任意文件 / 文件夹」右键 shell verb（fileAssociations 覆盖不到通配）。
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

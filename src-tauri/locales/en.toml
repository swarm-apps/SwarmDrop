# Desktop-shell native strings (tray + system notifications) — English.

[tray]
open = "Open SwarmDrop"
open_folder = "Open Received Folder"
settings = "Settings…"
quit = "Quit SwarmDrop"
pause = "Pause Receiving"
resume = "Resume Receiving"

[tray.status]
offline = "○ Disconnected"
online = "● Online · Ready to receive"
paused = "⏸ Receiving paused"
# Same sentence as `nodeHealth.isolated` in DESIGN.md (fourth catalog — Lingui never scans it)
isolated = "⚠ Can't reach any network — check your bootstrap nodes"

[notif.pairing]
title = "Pairing request"
body = "%{hostname} wants to pair with you"

[notif.incoming_transfer]
title = "Incoming file transfer"
body = "%{name} wants to send you files"

[notif.incoming_text]
title = "New text received"
body = "You received a text from %{name}"

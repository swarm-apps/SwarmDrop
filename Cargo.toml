[workspace]
members = [
    "crates/core",
    "crates/host",
    "crates/transfer",
    "crates/storage-sql",
    "crates/invite",
    "crates/web",
    "crates/entity",
    "crates/migration",
    "crates/net-base",
    "crates/net",
    "crates/webrtc-p2p",
    "crates/bootstrap",
    "src-tauri",
    "mobile/packages/swarmdrop-core/rust/mobile-core",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# default-features=false + 最小 features：entity 只吃类型宏，不吃 runtime——
# Web 端依赖 entity 时不再撞 mio/sqlite 编译墙（storage-abstraction.md 第 0 步）。
# runtime features（runtime-tokio-rustls/sqlx-sqlite）由需要连库的 crate 自己增量补。
sea-orm = { version = "2.0.0-rc", default-features = false, features = [
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
sea-orm-migration = { version = "2.0.0-rc", features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
swarmdrop-core = { path = "crates/core" }
swarmdrop-host = { path = "crates/host" }
swarmdrop-transfer = { path = "crates/transfer" }
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }

# ── 新网络内核（refactor/net-kernel，iroh 风格 API + wasm 双 target）──
swarmdrop-net-base = { path = "crates/net-base" }
swarmdrop-storage-sql = { path = "crates/storage-sql" }
swarmdrop-invite = { path = "crates/invite" }
swarmdrop-net = { path = "crates/net" }
# libp2p 系全部 pin 同一 git rev —— 且当前指向**个人 fork**，不是官方仓。
#
# 为什么是 git 不是 crates.io：crates.io 的 libp2p-webrtc 0.9.0-alpha.1 的 webrtc-direct
# 实证跑不通（spike/webrtc-direct-https）。修复在 master（PR 6429，2026-05-22 已合并），
# 但至今未进任何 crates.io 发布版。
#
# 为什么是 fork 不是官方 master：还有三个尚未合并的修复
# （fork 实测 ahead 7 / behind 0，全部已提上游，无未提项）：
#   PR #6558  fix(webrtc-websys): defer data channel callback wakes        （OPEN）
#   PR #6560  feat(webrtc): negotiate data channel message limits          （OPEN）
#             ↳ 含 receive buffer limit 修复（在 PR 分支上 squash 成 5984c716，
#               与 fork master 的 c4c2c167+989cb610 内容等价、SHA 不同）
#   PR #6472  fix(relay): avoid panic when dst has connections without     （OPEN，**上游自己的**）
#             reservations —— 我们独立提的 #6570 与它源码逐字节相同，
#             2026-07-28 已按维护者要求关闭，改跟 #6472
#
# 【退出条件】两阶段，各自可判定（完整判据 + 验证命令见 dev-notes/knowledge/net-kernel.md
# 的「临时 fork 集成策略 —— 含退出条件」）：
#   阶段 1 切回官方 git：#6558 / #6560 / #6472 均 MERGED 后，换回官方 URL + 上游 master rev
#          `gh pr view 6558 --repo libp2p/rust-libp2p --json state --jq .state`
#   阶段 2 切回 crates.io：`cargo search libp2p` 显示 ≥ 0.57.0（webrtc ≥ 0.10.0-alpha、
#                        stream ≥ 0.5.0-alpha）时，整体换成版本号依赖
#
# 对账 fork 与上游时别只比 commit SHA——PR 分支会 squash，SHA 对不上不等于补丁没提。
#
# 拖得越久 rebase 成本越高——动 crates/net 时顺手跑一遍上面两条命令。
# 升级 rev 必须走独立 PR + 全量测试 + wasm check，并同步 Cargo.lock。
libp2p = { git = "https://github.com/yexiyue/rust-libp2p", rev = "262dea51052aed5f4e64fd6cac60ff3b6d798a87" }
libp2p-stream = { git = "https://github.com/yexiyue/rust-libp2p", rev = "262dea51052aed5f4e64fd6cac60ff3b6d798a87" }
# crates/webrtc-p2p 用细粒度 core/swarm 而非 libp2p facade——它要独立发布，
# 依赖 facade 会把整个协议栈拖进它的依赖树（官方 transport crate 同样只依赖这两个）。
libp2p-core = { git = "https://github.com/yexiyue/rust-libp2p", rev = "262dea51052aed5f4e64fd6cac60ff3b6d798a87" }
libp2p-swarm = { git = "https://github.com/yexiyue/rust-libp2p", rev = "262dea51052aed5f4e64fd6cac60ff3b6d798a87" }
# DataChannel 之上的 libp2p framing（以及 Noise 握手、SDP 模板、certhash 编解码）。
# 泛型且不依赖 webrtc-rs，两个 target 共用。
#
# 注意：官方的 `libp2p-webrtc`（webrtc-direct）已于 2026-07-28 **整体移除**——它的活
# 由 `webrtc-p2p` 接了过来。留着它等于把 webrtc-rs 0.17 与 0.20 两套 ICE/DTLS/SCTP
# 同时编进二进制。`libp2p-webrtc-utils` 是另一个 crate，仍然要用。
libp2p-webrtc-utils = { git = "https://github.com/yexiyue/rust-libp2p", rev = "262dea51052aed5f4e64fd6cac60ff3b6d798a87" }
# 自研 WebRTC 传输，**同时提供打洞（`/webrtc`）与 direct（`/webrtc-direct`）两种模式**，
# 已完全取代官方 `libp2p-webrtc`。只有 crates/net 依赖它；打洞按 `Builder::webrtc_p2p`
# 开关，direct 始终启用（它是浏览器拨公网/同网裸 IP 的入口）。
webrtc-p2p = { path = "crates/webrtc-p2p" }
# identity/multiaddr 不走 git：93c5059 树自己就把两者解析到 crates.io（spike 的
# Cargo.lock 实证 libp2p-identity 0.2.14 / multiaddr 0.18.2 均为 registry 来源），
# net-base 用 crates.io 版本与 git 树天然 unify，类型底座不背 git 依赖。
libp2p-identity = "0.2"
multiaddr = "0.18"
# 运行时垫片：native = `pub use tokio::*`（类型等价零改动），wasm = spawn_local shim。
# `tokio::sync` 与 `select!` 不必替换（wasm 安全），只有 spawn/time 走它。
n0-future = "0.3"
cfg_aliases = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3.31"
unsigned-varint = { version = "0.8.0", features = ["futures"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = "1.49.0"
tokio-util = "0.7"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
rand = "0.10.0"
chrono = "0.4.43"
sha2 = "0.11"
async-trait = "0.1.89"
dashmap = "6.1.0"
tracing = "0.1.44"

[profile.dev.package."*"]
opt-level = 3

# 移动端 release —— 包体优先，与桌面的 `[profile.release]`（速度优先）分开。
#
# 为什么不直接写 `[profile.release]`：Cargo 只认 workspace root 的 profile，
# **member 自己的 profile 会被静默忽略**（只有一行 warning）。mobile-core 并入
# workspace 前是隐式 workspace root，自带这套 opt-level="z" 配置；并入后若不搬到
# 这里，移动端包体优化就无声无息地没了。而桌面 release 需要 opt-level=3，两者不能共用。
#
# 消费方：`ubrn build <platform> --profile mobile-release`（ubrn 的 -p 会覆盖 -r）。
# 产物落在 `target/mobile-release/`，不是 `target/release/`。
[profile.mobile-release]
inherits = "release"
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = "symbols"

# ── webrtc-rs 两处 pin：补丁已全部合并，等发版 ──────────────────────────────
#
# 五个补丁（rtc #137 / #138 / #140、webrtc #825 / #828）**已于 2026-07-29 全部合并**进
# 上游 master，但 crates.io 上仍是 `0.20.0-rc.4`（不含它们）。所以这里从「自有补丁」
# 降级成「等发版」——git rev 临时顶着，发版后换回版本号即可：
#
#   - `rtc`    → 直接指**官方** `webrtc-rs/rtc` 的 master commit，已无 fork
#   - `webrtc` → 仍需 fork，但只为一行集成适配（原因见下），功能补丁全在上游了
#
# ## 五个补丁在修什么（删本段前不必读，排查时有用）
#
# | PR | 症状 |
# |---|---|
# | rtc#137 | `disable_certificate_fingerprint_verification` 是死代码：有字段、有 setter，从没传给 `RTCDtlsTransport`。webrtc-direct 服务端收不到真 offer，只能本地合成 + 填占位指纹 + 关校验；开关失效则握手报 `ErrNoMatchingCertificateFingerprint`，direct 监听端整个起不来。 |
# | rtc#138 | `send` 只检查通道**已注册**，真正条件（SCTP stream 是否建立）在 `handle_write` 里查，而那层只 `warn!` 不上抛 → 调用方拿到 `Ok(())`，数据被丢。本仓 direct 链路上最贵的坑：Noise 首包在 `Connected` 时写出去就消失，全链路零报错。 |
# | rtc#140 | `RTCDataChannelInit` derive 的 `Default` 让 `ordered` 成了 `false`，用户数据会超车 DCEP 的 `DATA_CHANNEL_OPEN` → 每条流首条消息被丢，multistream-select 永不完成。 |
# | webrtc#825 | `on_data_channel` 把本端 `create_data_channel` 开的通道也回报一遍，且回报的句柄是死的（sender 已被占，callback 拿到的 receiver 永远收不到事件）。 |
# | webrtc#828 | `get_stats` 签名点名的 `StatsSelector` / `RTCStatsReport` 没被 `pub use`——一个公开的 trait 方法，参数和返回值在 crate 外**叫不出名字**。 |
#
# ⚠️ **`data_channel::await_open` 不能因为 #138 合并就删掉**：那个补丁改的是失败方式
# （静默丢 → 明确报错），不是「不用等」。时序窗口依然存在。
#
# 完整复盘（含每个坑怎么定位的）见 `dev-notes/blogs/webrtc/`。
#
# ## 退出条件（可判定）
#
# 五个 PR 的状态不必再查——都已 MERGED。只剩发版：
#
#   cargo search rtc --limit 1        # 期望 > 0.20.0-rc.4
#   cargo search webrtc --limit 1     # 期望 > 0.20.0-rc.4
#
# 两条都满足时，把本段连同 `[patch.crates-io]` 整个删掉，
# `crates/webrtc-p2p/Cargo.toml` 里的 `webrtc` 依赖抬到新版本号即可。
#
# ⚠️ **升级 rev 必须走独立 PR + 全量测试 + `./scripts/check-wasm.sh`**，并同步 Cargo.lock。
[patch.crates-io]
# 官方 master，含 #137 / #138 / #140。**已无自有补丁**——URL 就是上游仓库本身。
rtc = { git = "https://github.com/webrtc-rs/rtc", rev = "146b756315061502ea1e88f00fea7e53798619e1" }
# 官方 master（含 #825 / #828）+ 一行「rtc 走 crates.io」。
#
# 那一行**不能进上游**：上游用 `path = "rtc"` 指 submodule，而 `[patch.crates-io]`
# **不作用于 path 依赖**——保留 path 会让 webrtc 的 rtc 来自 submodule、本仓的 rtc 来自
# patch，两个 source id = 两个互不兼容的同名 crate，`webrtc` 返回的类型对不上本仓
# `use rtc::…` 的类型，直接编译失败。
#
# 所以 webrtc 这条 pin 会比 rtc 那条活得久：rtc 只是「等官方发版」，而它还额外背着
# 这行集成适配，必须等 crates.io 有含补丁的 webrtc 才能整条删掉。
webrtc = { git = "https://github.com/yexiyue/webrtc", rev = "3d6391cd9cf2ed88fbd0410f41d8c299046ff8ed" }

[workspace]
members = [
    "crates/core",
    "crates/host",
    "crates/transfer",
    "crates/storage-sql",
    "crates/invite",
    "crates/web",
    "crates/entity",
    "crates/migration",
    "crates/net-base",
    "crates/net",
    "crates/webrtc-p2p",
    "crates/bootstrap",
    "src-tauri",
    "mobile/packages/swarmdrop-core/rust/mobile-core",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# default-features=false + 最小 features：entity 只吃类型宏，不吃 runtime——
# Web 端依赖 entity 时不再撞 mio/sqlite 编译墙（storage-abstraction.md 第 0 步）。
# runtime features（runtime-tokio-rustls/sqlx-sqlite）由需要连库的 crate 自己增量补。
sea-orm = { version = "2.0.1", default-features = false, features = [
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
sea-orm-migration = { version = "2.0.1", features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
swarmdrop-core = { path = "crates/core" }
swarmdrop-host = { path = "crates/host" }
swarmdrop-transfer = { path = "crates/transfer" }
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }

# ── 新网络内核（refactor/net-kernel，iroh 风格 API + wasm 双 target）──
swarmdrop-net-base = { path = "crates/net-base" }
swarmdrop-storage-sql = { path = "crates/storage-sql" }
swarmdrop-invite = { path = "crates/invite" }
swarmdrop-net = { path = "crates/net" }
# libp2p 系全部 pin 同一 git rev —— 且当前指向**个人 fork**，不是官方仓。
#
# 为什么是 git 不是 crates.io：crates.io 的 libp2p-webrtc 0.9.0-alpha.1 的 webrtc-direct
# 实证跑不通（spike/webrtc-direct-https）。修复在 master（PR 6429，2026-05-22 已合并），
# 但至今未进任何 crates.io 发布版。
#
# 为什么是 fork 不是官方 master：四个尚未合并的 PR（三个修复 + 一条功能补丁）。
#   PR #6558  fix(webrtc-websys): defer data channel callback wakes        （OPEN）
#   PR #6560  feat(webrtc): negotiate data channel message limits          （OPEN）
#             ↳ 含 receive buffer limit 修复（在 PR 分支上 squash 成 5984c716，
#               与 fork master 的 c4c2c167+989cb610 内容等价、SHA 不同）
#   PR #6472  fix(relay): avoid panic when dst has connections without     （OPEN，**上游自己的**）
#             reservations —— 我们独立提的 #6570 与它源码逐字节相同，
#             2026-07-28 已按维护者要求关闭，改跟 #6472
#   PR #6576  feat(identify): allow updating `agent_version` at runtime    （OPEN，2026-08-01 提）
#             给 identify 的 `Behaviour` 加 `set_agent_version`，逐连接下发新值 ——
#             没有它，改设备名必须重启整个节点（断开所有连接、中断进行中的传输）。
#             **PR 分支与 pin 的分支不是同一条**：pin 指向 fork 的
#             `feat/identify-runtime-agent-version`（基线 262dea51，不在上游 master 线上）；
#             PR 走的是 rebase 到上游 master 的 `feat/identify-set-agent-version`。
#             两条内容等价、SHA 不同 —— 别按 SHA 对账。**pin 的那条不能 force-push**，
#             否则 d858435c 变游离对象、被 GC 后本仓构建直接断。
#             它独立于上面三条，未合并不阻塞阶段 1 的判定，但阻塞「删掉 fork pin」这个终局。
#
# 【退出条件】两阶段，各自可判定（完整判据 + 验证命令见 dev-notes/knowledge/net-kernel.md
# 的「临时 fork 集成策略 —— 含退出条件」）：
#   阶段 1 切回官方 git：#6558 / #6560 / #6472 均 MERGED 后，换回官方 URL + 上游 master rev
#          （#6576 不进这条判据 —— 它管的是阶段 2 之后「删掉 fork pin」那一步）
#          `gh pr view 6558 --repo libp2p/rust-libp2p --json state --jq .state`
#   阶段 2 切回 crates.io：`cargo search libp2p` 显示 ≥ 0.57.0（webrtc ≥ 0.10.0-alpha、
#                        stream ≥ 0.5.0-alpha）时，整体换成版本号依赖
#
# 对账 fork 与上游时别只比 commit SHA——PR 分支会 squash，SHA 对不上不等于补丁没提。
#
# 拖得越久 rebase 成本越高——动 crates/net 时顺手跑一遍上面两条命令。
# 升级 rev 必须走独立 PR + 全量测试 + wasm check，并同步 Cargo.lock。
libp2p = { git = "https://github.com/yexiyue/rust-libp2p", rev = "d858435cfede61115d705ed4797187eef0258861" }
libp2p-stream = { git = "https://github.com/yexiyue/rust-libp2p", rev = "d858435cfede61115d705ed4797187eef0258861" }
# crates/webrtc-p2p 用细粒度 core/swarm 而非 libp2p facade——它要独立发布，
# 依赖 facade 会把整个协议栈拖进它的依赖树（官方 transport crate 同样只依赖这两个）。
libp2p-core = { git = "https://github.com/yexiyue/rust-libp2p", rev = "d858435cfede61115d705ed4797187eef0258861" }
libp2p-swarm = { git = "https://github.com/yexiyue/rust-libp2p", rev = "d858435cfede61115d705ed4797187eef0258861" }
# DataChannel 之上的 libp2p framing（以及 Noise 握手、SDP 模板、certhash 编解码）。
# 泛型且不依赖 webrtc-rs，两个 target 共用。
#
# 注意：官方的 `libp2p-webrtc`（webrtc-direct）已于 2026-07-28 **整体移除**——它的活
# 由 `webrtc-p2p` 接了过来。留着它等于把 webrtc-rs 0.17 与 0.20 两套 ICE/DTLS/SCTP
# 同时编进二进制。`libp2p-webrtc-utils` 是另一个 crate，仍然要用。
libp2p-webrtc-utils = { git = "https://github.com/yexiyue/rust-libp2p", rev = "d858435cfede61115d705ed4797187eef0258861" }
# 自研 WebRTC 传输，**同时提供打洞（`/webrtc`）与 direct（`/webrtc-direct`）两种模式**，
# 已完全取代官方 `libp2p-webrtc`。只有 crates/net 依赖它；打洞按 `Builder::webrtc_p2p`
# 开关，direct 始终启用（它是浏览器拨公网/同网裸 IP 的入口）。
webrtc-p2p = { path = "crates/webrtc-p2p" }
# identity/multiaddr 不走 git：93c5059 树自己就把两者解析到 crates.io（spike 的
# Cargo.lock 实证 libp2p-identity 0.2.14 / multiaddr 0.18.2 均为 registry 来源），
# net-base 用 crates.io 版本与 git 树天然 unify，类型底座不背 git 依赖。
libp2p-identity = "0.2"
multiaddr = "0.18"
# 运行时垫片：native = `pub use tokio::*`（类型等价零改动），wasm = spawn_local shim。
# `tokio::sync` 与 `select!` 不必替换（wasm 安全），只有 spawn/time 走它。
n0-future = "0.3"
cfg_aliases = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3.31"
unsigned-varint = { version = "0.8.0", features = ["futures"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = "1.49.0"
tokio-util = "0.7"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
rand = "0.10.0"
chrono = "0.4.43"
sha2 = "0.11"
async-trait = "0.1.89"
dashmap = "6.1.0"
tracing = "0.1.44"
# 日志订阅端。放 workspace 是因为桌面壳也要用同一套（src-tauri 目前自带版本号，
# 后续做桌面日志落盘时一并收敛过来）。
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# 文件层：按天轮转 + 保留数上限。**注意 `non_blocking()` 返回的 guard 一旦 drop，
# 后台写线程就停、日志静默消失且不报错** —— 它必须与应用同生命周期。
tracing-appender = "0.2.5"

# ── 临时 patch：rtc 全家桶 → 上游 v0.20.x 维护分支 ─────────────────────────
#
# 修的是两条同源 bug：**「过期的 deadline 让 sans-IO driver 空转烧核」**。
#
# [rtc#158](https://github.com/webrtc-rs/rtc/issues/158)（ICE，本仓 2026-08-11 实测踩到）：
# ICE agent 进入 `Failed` / `Closed` 后，`Agent::contact()` 在早返回路径上**不更新
# `last_checking_time`**，而 `poll_timeout()` 仍拿它派生连通性检查的截止时刻——那个时刻
# 于是永远落在过去。`PeerConnectionDriver::event_loop` 对已过期的 deadline 走
# `handle_timeout(now)` + `continue`，**那条 `continue` 跳过了整个 `select!`**，于是：
#
#   1. driver 以 100% 占满一个核，并且
#   2. 它**再也读不到命令通道**——`close()` 永远送不进去。
#
# 第 2 条是关键：`ManagedPeerConnection` 那道关闭守卫（见
# `crates/webrtc-p2p/src/backend/native/managed.rs`）因此**形同虚设**——它 drop 时派出的
# `pc.close().await` 需要 driver 配合才能完成。于是每条这样死掉的连接都留下一个永久
# 烧核的任务。实测：桌面端接过几次浏览器（webrtc-direct）连接后 CPU 718%、
# `swarmdrop_net` 的 actor 被饿死、日志整片消失、7GB 传输中途卡死、web→native 吞吐
# 塌到 500 KB/s。同一失效模式 2026-08-06 发作过一次（当时 948%），但归因只落到
# 「谁来调 close」，没查到这一层——所以那次的修复挡不住它。
#
# [rtc#161](https://github.com/webrtc-rs/rtc/pull/161)（TURN）是同一类问题的另一处，
# 顺带拿到。
#
# 【为什么是 patch 而不是把 `rtc` 改成 git 依赖】
# 真正跑 ICE 的 driver 在 **`webrtc` crate 内部**，它从 crates.io 拉自己的 `rtc-ice`。
# 改 `crates/webrtc-p2p` 里我们**直接声明**的那条 `rtc` 依赖，管不到 `webrtc` 的传递
# 依赖——只有 `[patch.crates-io]` 作用于整棵树。
#
# 【为什么 patch 整个 workspace 而不只 `rtc-ice`】
# 只换它一个时，git 版 rtc-ice 会经**仓内 path 依赖**拉进自己那份 rtc-shared /
# rtc-stun / rtc-mdns / rtc-crypto，而 crates.io 版的 rtc / rtc-dtls / rtc-sctp 仍用
# crates.io 那份——同名类型分叉成两个，报「expected rtc::rtc_ice::X, found rtc_ice::X」
# 这类极绕的错（`crates/webrtc-p2p/Cargo.toml` 里早就记过这个坑）。实测 `cargo update`
# 会把 rtc-crypto / rtc-mdns / rtc-shared / rtc-stun 各解析出两份。全列而不是只补当前
# 分叉的那四个：「整棵子树同源」是个能一眼校验的不变量，「刚好补齐」不是。
#
# 【为什么指 v0.20.x 而不是 master】
# master 的 workspace 版本已是 `0.21.0-alpha.1`，且做了一次 API 大重构（`SettingEngine`
# 的 `set_lite` / `set_answering_dtls_role` / `set_ice_credentials` 全没了，
# `RTCCertificate` 换成 `RTCCrypto` 注入……实测本仓 11 处编译错，全在 direct 模式最核心
# 的地方）。**v0.20.x 分支同时含 #159 与 #161，版本号仍是 0.20.1**——满足依赖树里的
# `^0.20.0`，patch 直接生效，且 API 零变更。用 rev 不用 branch：分支会移动。
#
# 【退出条件（可判定）】
# crates.io 的 rtc 发布 ≥ 0.20.2（含这两条修复）→ 删掉本段，版本号提上去：
#   cargo search rtc --limit 1
[patch.crates-io]
rtc = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-datachannel = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-dtls = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-ice = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-interceptor = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-interceptor-derive = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-mdns = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-media = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-rtcp = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-rtp = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-sctp = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-sdp = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-shared = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-srtp = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-stun = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }
rtc-turn = { git = "https://github.com/webrtc-rs/rtc", rev = "1ab0b0837d74b09352adff3ae23c05124fa12586" }

[profile.dev.package."*"]
opt-level = 3

# 移动端 release —— 与桌面的 `[profile.release]` 分开，但**不再是「包体优先」**。
#
# 为什么不直接写 `[profile.release]`：Cargo 只认 workspace root 的 profile，
# **member 自己的 profile 会被静默忽略**（只有一行 warning）。mobile-core 并入
# workspace 前是隐式 workspace root，自带这套配置；并入后若不搬到这里，移动端的
# profile 就无声无息地没了。分开保留是为了 `lto` / `codegen-units` / `strip` 这三项。
#
# 消费方：`ubrn build <platform> --profile mobile-release`（ubrn 的 -p 会覆盖 -r）。
# 产物落在 `target/mobile-release/`，不是 `target/release/`。
#
# # 为什么 `opt-level` 从 `"z"` 改回了 3（2026-08-10）
#
# 因为 `"z"` 在**传输热路径**上的代价是数量级的，而它省下的体积并不可观——这一点被
# 两次独立的实测撞出来，第二次证明了「开单包例外」是打地鼠：
#
# 1. **blake3**：`"z"` 会一路传到它 build.rs 的 cc 调用，把 aarch64 的 C NEON 实现
#    （`c/blake3_neon.c`，对 little-endian aarch64 无条件启用）按在 `-Oz` 上。
# 2. **WebRTC 数据面**：DTLS 记录层走的是 RustCrypto 的**纯 Rust** 实现
#    （`aes` / `aes-gcm` / `ghash` / `polyval`…），不是 ring / aws-lc 那样的 asm；
#    SCTP 每个包还要算 `crc`。纯 Rust 的 AES-GCM 与 GHASH 高度依赖内联与循环展开，
#    而 `"z"` 恰好把这两样都关掉。这解释了三端实测里一条否则说不通的分裂：**同一台
#    Android 手机**，走 QUIC/Noise 是 12–23 MB/s，走 WebRTC 掉到 0.36–0.96 MB/s；
#    同一条 WebRTC 链路换成 `opt-level = 3` 的桌面端做对端就有 6–10+ MB/s。差别正是
#    「加密走 asm（quinn/rustls → ring）还是走被 `-Oz` 阉割的纯 Rust（webrtc-rs →
#    RustCrypto）」。详见 `dev-notes/research/2026-08-10-v0.15.2-field-test.md`。
#
# 判据是**按字节计费的热点**。问题在于这类热点遍布整棵依赖树（哈希、AEAD、GHASH、
# CRC、分片、编解码…），逐个开 `[profile.mobile-release.package.*]` 例外既列不全，
# 也会让「为什么是这几个包」变成一笔谁也不敢动的糊涂账。传输吞吐是本 App 的核心
# 功能，不是可以拿来换几 MB 的东西。
#
# 体积由 `lto = "thin"` + `codegen-units = 1` + `strip = "symbols"` 承担——这三项都
# **不牺牲**运行速度（前两项还会提升）。
#
# ⚠️ **`opt-level = 3` 目前是一个待验证的假设**：慢的那条链路同时还差着「打洞 vs
# webrtc-direct」这个未分离的变量。重测同一条打洞链路才能定案。若实测证明与吞吐无关，
# 回退前请先把结论写回上面那份报告——别让它变成又一条没人知道为什么存在的配置。
[profile.mobile-release]
inherits = "release"
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

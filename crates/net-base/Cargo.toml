[package]
name = "swarmdrop-net-base"
version = "0.1.0"
edition.workspace = true

# 类型底座：跨 FFI / IPC / entity 复用的网络身份与地址类型。
# 刻意保持依赖极小（无 tokio、无 swarm、无 transport），wasm 天然可编。
# libp2p 类型（PeerId/Multiaddr/Keypair）在此收口成 newtype，不再向上穿透。

[dependencies]
libp2p-identity = { workspace = true, features = ["ed25519", "peerid", "rand"] }
multiaddr = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
# 只给 compact 的体积回归测试用：`CompactAddrs` 本身不绑定序列化格式，
# 但它的唯一消费者（crates/invite 的邀请 wire）用 postcard，量体积得按同一把尺。
postcard = { version = "1.1", features = ["use-std"] }

[features]
default = []
# 桌面 IPC 的类型导出（tauri-specta）。默认关闭 —— 移动端与 wasm 都不需要它，
# 上面「依赖极小」的底座约束因此仍然成立。只有 TransportKind 这类会随
# swarmdrop-host 的 DTO 进 bindings.ts 的枚举需要它。
specta = ["dep:specta"]

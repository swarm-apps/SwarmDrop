[package]
name = "webtransport-p2p"
version = "0.1.0"
edition.workspace = true

# libp2p WebTransport 传输（spec: libp2p/specs 的 webtransport/README.md）。
#
# rust-libp2p 只有 `transports/webtransport-websys`（浏览器侧拨号，wasm），**没有 native
# listener** —— 浏览器能拨、没人能接。上游 PR #4348（mxinden 的 native draft）自 2023-10
# 停在 draft。本 crate 补的正是这个缺口。
#
# **刻意不带 swarmdrop 前缀、不依赖任何 swarmdrop crate。** 它现在长在本仓里只是为了借
# crates/net 做集成测试、迭代快；稳定后要 subtree split 出去独立发布。任何反向依赖都会把
# 这条路堵死 —— 评审时优先看这一条（`webrtc-p2p` 顶部有一模一样的约定）。
#
# **native-only，不参与 wasm target。** 浏览器侧用上游现成的 `libp2p-webtransport-websys`，
# 由 crates/net 按 target 分派。给本 crate 加一层 wasm 抽象是 YAGNI —— 只有一个实现的
# trait 会污染整层签名。
#
# 设计与决策：openspec/changes/webtransport-native-transport/design.md

[dependencies]
# WebTransport over HTTP/3。选它而非 `web-transport-quinn`：三条硬需求只有它全中 ——
# 自签名 ECDSA P-256 + 可注入 not_before/not_after、`Certificate::hash()` 明确给
# serverCertificateHashes 用、`Endpoint::reload_config` 明写「刷新 TLS 证书不断既有连接」
# （证书轮换的硬前提，对方没有对应 API）。
#
# 默认 features 已含 `self-signed`（证书生成）与 `ring`（crypto provider，与本仓
# libp2p-quic 同源）。**不要开 aws-lc-rs** —— 那会让进程里出现两个 rustls provider。
#
# ⚠️ **不要开 `quinn` feature**。它把底层 `quinn::Connection` 暴露出来（RTT / 丢包 /
# 拥塞窗口都在上面），选型时曾以为需要 —— 但一旦转出到本 crate 的公共 API，就等于把
# **wtransport 与 quinn 两个版本**一起焊进契约，而本 crate 要独立发布。
# 真需要连接统计时，正确做法是转出本 crate 自己的值类型（`ConnectionStats { rtt, .. }`），
# 而不是把第三方句柄递出去。
wtransport = "0.7.1"
libp2p-core = { workspace = true }
libp2p-identity = { workspace = true }
# `Config::with_webtransport_certhashes` 两侧都现成，spec 里最难的一块不用自己实现。
libp2p-noise = { workspace = true }
futures = { workspace = true }
# 握手超时。选它而非 tokio::time：与 `webrtc-p2p` 一致，且 rust-libp2p 自己就用它。
futures-timer = "3"
# accept 循环要 spawn。只要 `rt`——本 crate 不碰 tokio 的 IO/时间原语。
tokio = { workspace = true, features = ["rt", "sync"] }
# wtransport 的 SendStream/RecvStream 是 **tokio** 方言的 AsyncRead/AsyncWrite，
# libp2p 要 **futures** 方言，靠它转。
tokio-util = { workspace = true, features = ["compat"] }
# 从内存字符串解析 PEM。wtransport 只提供 `load_pemfile(path)`（async 读文件），
# 而证书对的持久化走的是宿主注入的端口、拿到的是字符串。它是 wtransport 内部
# 用的同一个 crate，故解析结果逐位一致。
rustls-pki-types = "1"
# 读回证书的有效期与公钥算法。**版本必须与 wtransport 对齐（0.18）**：判据要与它客户端侧
# 的 `ServerHashVerification` 逐条一致，两份 x509-parser 会让 OID 常量变成两个不同的类型。
x509-parser = "0.18"
# `x509-parser` 与 `wtransport` 的证书时刻都用它。同理必须同源。
time = "0.3"
thiserror = { workspace = true }
tracing = { workspace = true }
# 枚举本机网卡。绑 `0.0.0.0` 时必须展开成具体地址再通告 —— 通配地址对端没法拨。
# 与 `webrtc-p2p` 同版本，避免依赖树里出现两份。
if-addrs = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true }
# 测试要造身份：`rand` 给 `PeerId::random`，`ed25519` 给 `Keypair::generate_ed25519`。
# 生产依赖刻意不开这两个 —— 身份由调用方传入，本 crate 不生成任何 libp2p 密钥。
libp2p-identity = { workspace = true, features = ["rand", "ed25519"] }
# 内存双工流。L1 层不依赖 wtransport，Noise 握手因此可以完全脱离真实网络测试
# —— rust-libp2p 自己的 noise 测试用的也是它。
futures_ringbuf = "0.4"

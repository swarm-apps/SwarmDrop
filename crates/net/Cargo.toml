[package]
name = "swarmdrop-net"
version = "0.1.0"
edition.workspace = true

# SwarmDrop 网络内核：iroh 风格 API（Endpoint/Router/ProtocolHandler/AddressLookup），
# libp2p 底层，native + wasm32-unknown-unknown 双 target。
#
# 依赖用 target 三段式而非 feature 开关：同一 crate 双 target，feature 是加性的
# 会在 workspace feature unification 下爆炸，target 表才是「按平台换实现」的正解
# （iroh 同款做法，见 dev-notes/knowledge/libp2p-wasm.md）。

[dependencies]
swarmdrop-net-base = { workspace = true }
# WebRTC 打洞传输。放顶层而非 target 表——它自己按 target 换后端（native = webrtc-rs，
# wasm = 浏览器 RTCPeerConnection），双 target 都要编。
webrtc-p2p = { workspace = true }
n0-future = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# wasm 上 tokio 只有 sync/macros 可用（纯用户态原语）；spawn/time 走 n0-future
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util = { workspace = true }
# RPC 帧的 CBOR 编解码（libp2p request-response 内部同款库）
cbor4ii = { version = "1", features = ["use_std", "serde1"] }
# DhtKey 的 SHA256 派生（迁自旧栈 dht_key.rs）
sha2 = { workspace = true }

# ============ native ============
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libp2p = { workspace = true, features = [
    "ed25519",
    "macros",
    "tokio",
    "tcp",
    "quic",
    # dns 是 native 默认要的（/dns4 地址解析）。Android 的差异走 transport.rs 的
    # target cfg 分支，不走 crate feature——双 target 下 feature 面越小越好。
    "dns",
    "mdns",
    "noise",
    "yamux",
    "kad",
    "identify",
    "ping",
    "relay",
    "dcutr",
    "autonat",
    "serde",
] }
libp2p-stream = { workspace = true }
# WebTransport 的 native 一半（listener + dialer）。放 target 表而非顶层：它是
# native-only 的（浏览器那半用上游的 websys 版），编不到 wasm。
webtransport-p2p = { workspace = true }
# `WebTransportFileCertificateStore` 的原子写。四条安全属性（随机名、`O_EXCL` 创建、
# unix `0600`、提前返回时清残留）交给它而不是自己搓——那份代码里有一半篇幅是在向读者
# 证明 `open(2)` 的语义，而写错的后果是私钥以 umask 默认权限落盘。
tempfile = { workspace = true }

# ============ android ============
# Android 显式公共 DNS（transport.rs）要构造 NameServerConfig，libp2p::dns 不
# re-export 它，需直接引 hickory。版本必须与 libp2p-dns 同线——分叉则类型不通，
# 编译期就响。背景与炸点见 dev-notes/knowledge/net-kernel.md 坑 7。
[target.'cfg(target_os = "android")'.dependencies]
hickory-resolver = "0.26"

# ============ wasm（浏览器）============
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
libp2p = { workspace = true, features = [
    "ed25519",
    "macros",
    "noise",
    "yamux",
    "kad",
    "identify",
    "ping",
    "relay",
    "serde",
] }
libp2p-stream = { workspace = true }
# WebTransport 的浏览器一半。只能拨号（浏览器起不了监听），与 native 侧的
# `webtransport-p2p` 按 target 二选一。
libp2p-webtransport-websys = { workspace = true }
# 运行时探测 `WebTransport` 这个全局对象在不在 —— 它是本仓第一个「浏览器可能没有」的
# 传输（Safari < 18.2、Firefox < 114、老 WebView 都没有），不探测就会多报能力。
js-sys = "0.3"
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
# libp2p 依赖但不 re-export；wasm 上没有 tokio::time，底层超时靠它
futures-timer = { version = "3", features = ["wasm-bindgen"] }
# master 的 libp2p-swarm 精确 pin =0.4.58，必须跟着钉，否则 cargo 无解
wasm-bindgen-futures = "=0.4.58"
# Window/Worker 环境探测（见 transport.rs）
web-sys = { version = "0.3", features = ["Window"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
